<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABC & 123 Learning Fun!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard', cursive, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3em;
            text-shadow: 3px 3px 0 #ff6b6b, 6px 6px 0 #feca57;
            margin-bottom: 30px;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .nav-btn {
            padding: 15px 30px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .nav-btn.abc {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            color: white;
        }

        .nav-btn.numbers {
            background: linear-gradient(45deg, #5f27cd, #00d2d3);
            color: white;
        }

        .nav-btn.tracing {
            background: linear-gradient(45deg, #10ac84, #1dd1a1);
            color: white;
        }

        .nav-btn.games {
            background: linear-gradient(45deg, #ee5a24, #f368e0);
            color: white;
        }

        .nav-btn:hover {
            transform: scale(1.1) rotate(-3deg);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .nav-btn.active {
            transform: scale(1.15);
            box-shadow: 0 0 30px rgba(255,255,255,0.5);
        }

        .section {
            display: none;
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }

        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ABC Grid */
        .abc-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .letter-card {
            aspect-ratio: 1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        .letter-card:hover {
            transform: scale(1.15) rotate(5deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .letter-card .uppercase {
            font-size: 1.2em;
        }

        .letter-card .lowercase {
            font-size: 0.7em;
            opacity: 0.8;
        }

        .letter-card .emoji {
            font-size: 0.5em;
            margin-top: 5px;
        }

        /* Numbers Grid */
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .number-card {
            aspect-ratio: 1;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .number-card:hover {
            transform: scale(1.15) rotate(-5deg);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .number-card .dots {
            font-size: 0.4em;
            margin-top: 10px;
            letter-spacing: 3px;
        }

        /* Tracing Section */
        .tracing-container {
            text-align: center;
        }

        .tracing-controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tracing-btn {
            padding: 10px 25px;
            font-size: 1.2em;
            border: 3px solid #10ac84;
            background: white;
            color: #10ac84;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .tracing-btn:hover {
            background: #10ac84;
            color: white;
        }

        .tracing-btn.active {
            background: #10ac84;
            color: white;
        }

        #tracingCanvas {
            border: 5px dashed #10ac84;
            border-radius: 20px;
            cursor: crosshair;
            background: #f8f9fa;
            touch-action: none;
        }

        .tracing-instructions {
            text-align: center;
            color: #666;
            margin-top: 15px;
            font-size: 1.1em;
        }

        /* Games Section */
        .game-container {
            text-align: center;
        }

        .game-selector {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .game-btn {
            padding: 15px 25px;
            font-size: 1.1em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .game-btn.letter-match {
            background: linear-gradient(45deg, #ff9ff3, #feca57);
            color: white;
        }

        .game-btn.number-count {
            background: linear-gradient(45deg, #54a0ff, #5f27cd);
            color: white;
        }

        .game-btn.active {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .game-area {
            background: #f8f9fa;
            border-radius: 20px;
            padding: 30px;
            min-height: 300px;
        }

        .game-question {
            font-size: 2em;
            margin-bottom: 20px;
            color: #333;
        }

        .game-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .game-option {
            padding: 20px;
            font-size: 2em;
            border: 3px solid #ddd;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
        }

        .game-option:hover {
            border-color: #10ac84;
            transform: scale(1.05);
        }

        .game-option.correct {
            background: #10ac84;
            color: white;
            border-color: #10ac84;
            animation: celebrate 0.5s ease;
        }

        .game-option.wrong {
            background: #ee5a24;
            color: white;
            border-color: #ee5a24;
            animation: shake 0.5s ease;
        }

        @keyframes celebrate {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .score-display {
            font-size: 1.5em;
            margin-top: 20px;
            color: #10ac84;
        }

        .stars {
            font-size: 2em;
            margin-top: 10px;
        }

        /* Modal for letter/number info */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 30px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-letter {
            font-size: 8em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-emoji {
            font-size: 4em;
            margin: 20px 0;
        }

        .modal-word {
            font-size: 2em;
            color: #666;
        }

        .modal-close {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.3em;
            border: none;
            border-radius: 50px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 2em; }
            .nav-btn { padding: 10px 20px; font-size: 1em; }
            .letter-card { font-size: 1.8em; }
            .number-card { font-size: 2em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 ABC & 123 Learning Fun! 🌟</h1>

        <div class="nav-tabs">
            <button class="nav-btn abc active" onclick="showSection('abc')">🔤 ABCs</button>
            <button class="nav-btn numbers" onclick="showSection('numbers')">🔢 123s</button>
            <button class="nav-btn tracing" onclick="showSection('tracing')">✏️ Tracing</button>
            <button class="nav-btn games" onclick="showSection('games')">🎮 Games</button>
        </div>

        <!-- ABC Section -->
        <div id="abc-section" class="section active">
            <h2 style="text-align: center; color: #ff6b6b; margin-bottom: 20px; font-size: 2em;">Click a letter to learn more!</h2>
            <div class="abc-grid" id="abcGrid"></div>
        </div>

        <!-- Numbers Section -->
        <div id="numbers-section" class="section">
            <h2 style="text-align: center; color: #5f27cd; margin-bottom: 20px; font-size: 2em;">Click a number to count!</h2>
            <div class="numbers-grid" id="numbersGrid"></div>
        </div>

        <!-- Tracing Section -->
        <div id="tracing-section" class="section">
            <div class="tracing-container">
                <h2 style="text-align: center; color: #10ac84; margin-bottom: 20px; font-size: 2em;">Practice Writing!</h2>
                <div class="tracing-controls">
                    <button class="tracing-btn" onclick="setTracingMode('A')">A</button>
                    <button class="tracing-btn" onclick="setTracingMode('B')">B</button>
                    <button class="tracing-btn" onclick="setTracingMode('C')">C</button>
                    <button class="tracing-btn" onclick="setTracingMode('1')">1</button>
                    <button class="tracing-btn" onclick="setTracingMode('2')">2</button>
                    <button class="tracing-btn" onclick="setTracingMode('3')">3</button>
                    <button class="tracing-btn" onclick="clearCanvas()">🗑️ Clear</button>
                </div>
                <canvas id="tracingCanvas" width="500" height="400"></canvas>
                <p class="tracing-instructions">Trace over the letter/number, or draw freely!</p>
            </div>
        </div>

        <!-- Games Section -->
        <div id="games-section" class="section">
            <div class="game-container">
                <h2 style="text-align: center; color: #ee5a24; margin-bottom: 20px; font-size: 2em;">Let's Play!</h2>
                <div class="game-selector">
                    <button class="game-btn letter-match active" onclick="startLetterGame()">🔤 Letter Match</button>
                    <button class="game-btn number-count" onclick="startNumberGame()">🔢 Counting</button>
                </div>
                <div class="game-area" id="gameArea">
                    <p style="font-size: 1.5em; color: #666;">Select a game to start playing!</p>
                </div>
                <div class="score-display" id="scoreDisplay"></div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="infoModal">
        <div class="modal-content">
            <div class="modal-letter" id="modalLetter"></div>
            <div class="modal-emoji" id="modalEmoji"></div>
            <div class="modal-word" id="modalWord"></div>
            <button class="modal-close" onclick="closeModal()">Great! ✓</button>
        </div>
    </div>

    <script>
        // Data
        const alphabet = [
            { letter: 'A', word: 'Apple', emoji: '🍎' },
            { letter: 'B', word: 'Ball', emoji: '⚽' },
            { letter: 'C', word: 'Cat', emoji: '🐱' },
            { letter: 'D', word: 'Dog', emoji: '🐕' },
            { letter: 'E', word: 'Elephant', emoji: '🐘' },
            { letter: 'F', word: 'Fish', emoji: '🐟' },
            { letter: 'G', word: 'Grape', emoji: '🍇' },
            { letter: 'H', word: 'House', emoji: '🏠' },
            { letter: 'I', word: 'Ice Cream', emoji: '🍦' },
            { letter: 'J', word: 'Juice', emoji: '🧃' },
            { letter: 'K', word: 'Kite', emoji: '🪁' },
            { letter: 'L', word: 'Lion', emoji: '🦁' },
            { letter: 'M', word: 'Moon', emoji: '🌙' },
            { letter: 'N', word: 'Nest', emoji: '🪺' },
            { letter: 'O', word: 'Orange', emoji: '🍊' },
            { letter: 'P', word: 'Penguin', emoji: '🐧' },
            { letter: 'Q', word: 'Queen', emoji: '👑' },
            { letter: 'R', word: 'Rainbow', emoji: '🌈' },
            { letter: 'S', word: 'Star', emoji: '⭐' },
            { letter: 'T', word: 'Tree', emoji: '🌳' },
            { letter: 'U', word: 'Umbrella', emoji: '☂️' },
            { letter: 'V', word: 'Volcano', emoji: '🌋' },
            { letter: 'W', word: 'Whale', emoji: '🐋' },
            { letter: 'X', word: 'Xylophone', emoji: '🎹' },
            { letter: 'Y', word: 'Yo-yo', emoji: '🪀' },
            { letter: 'Z', word: 'Zebra', emoji: '🦓' }
        ];

        const colors = [
            '#ff6b6b', '#feca57', '#ff9ff3', '#54a0ff', '#5f27cd',
            '#00d2d3', '#10ac84', '#1dd1a1', '#f368e0', '#ee5a24'
        ];

        // Section navigation
        function showSection(section) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(section + '-section').classList.add('active');
            document.querySelector(`.nav-btn.${section}`).classList.add('active');
        }

        // Initialize ABC grid
        function initABCGrid() {
            const grid = document.getElementById('abcGrid');
            alphabet.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'letter-card';
                card.style.background = `linear-gradient(135deg, ${colors[index % colors.length]}, ${colors[(index + 3) % colors.length]})`;
                card.style.color = 'white';
                card.innerHTML = `
                    <span class="uppercase">${item.letter}</span>
                    <span class="lowercase">${item.letter.toLowerCase()}</span>
                    <span class="emoji">${item.emoji}</span>
                `;
                card.onclick = () => showLetterInfo(item);
                grid.appendChild(card);
            });
        }

        // Initialize Numbers grid
        function initNumbersGrid() {
            const grid = document.getElementById('numbersGrid');
            for (let i = 1; i <= 20; i++) {
                const card = document.createElement('div');
                card.className = 'number-card';
                card.style.background = `linear-gradient(135deg, ${colors[i % colors.length]}, ${colors[(i + 5) % colors.length]})`;
                card.style.color = 'white';
                card.innerHTML = `
                    <span>${i}</span>
                    <span class="dots">${'●'.repeat(Math.min(i, 10))}${i > 10 ? '+' : ''}</span>
                `;
                card.onclick = () => showNumberInfo(i);
                grid.appendChild(card);
            }
        }

        // Modal functions
        function showLetterInfo(item) {
            document.getElementById('modalLetter').textContent = item.letter;
            document.getElementById('modalLetter').style.color = colors[alphabet.indexOf(item) % colors.length];
            document.getElementById('modalEmoji').textContent = item.emoji;
            document.getElementById('modalWord').textContent = `${item.letter} is for ${item.word}`;
            document.getElementById('infoModal').classList.add('active');
        }

        function showNumberInfo(num) {
            document.getElementById('modalLetter').textContent = num;
            document.getElementById('modalLetter').style.color = colors[(num - 1) % colors.length];
            document.getElementById('modalEmoji').textContent = '🎈'.repeat(Math.min(num, 5));
            document.getElementById('modalWord').textContent = `This is the number ${num}!`;
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        // Tracing
        let canvas, ctx, isDrawing = false;
        let currentTracing = null;

        function initTracing() {
            canvas = document.getElementById('tracingCanvas');
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#10ac84';
            ctx.lineWidth = 8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);

            // Touch support
            canvas.addEventListener('touchstart', handleTouch);
            canvas.addEventListener('touchmove', handleTouch);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function handleTouch(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 'mousemove', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(mouseEvent);
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const rect = canvas.getBoundingClientRect();
            ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
        }

        function draw(e) {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function setTracingMode(char) {
            currentTracing = char;
            clearCanvas();

            // Draw guide
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 3;
            ctx.setLineDash([10, 10]);
            ctx.font = '300px Comic Sans MS';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.strokeText(char, canvas.width / 2, canvas.height / 2);
            ctx.setLineDash([]);

            // Reset to drawing color
            ctx.strokeStyle = '#10ac84';
            ctx.lineWidth = 8;

            document.querySelectorAll('.tracing-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            currentTracing = null;
            document.querySelectorAll('.tracing-btn').forEach(b => b.classList.remove('active'));
        }

        // Games
        let score = 0;
        let currentGame = null;

        function startLetterGame() {
            currentGame = 'letter';
            document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.game-btn.letter-match').classList.add('active');
            generateLetterQuestion();
        }

        function startNumberGame() {
            currentGame = 'number';
            document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.game-btn.number-count').classList.add('active');
            generateNumberQuestion();
        }

        function generateLetterQuestion() {
            const target = alphabet[Math.floor(Math.random() * alphabet.length)];
            const options = [target];

            while (options.length < 4) {
                const random = alphabet[Math.floor(Math.random() * alphabet.length)];
                if (!options.find(o => o.letter === random.letter)) {
                    options.push(random);
                }
            }

            // Shuffle options
            options.sort(() => Math.random() - 0.5);

            const gameArea = document.getElementById('gameArea');
            gameArea.innerHTML = `
                <div class="game-question">Find the letter for "${target.word}" ${target.emoji}</div>
                <div class="game-options">
                    ${options.map(opt => `
                        <div class="game-option" onclick="checkLetterAnswer('${opt.letter}', '${target.letter}', this)">
                            ${opt.letter}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function checkLetterAnswer(selected, correct, element) {
            if (selected === correct) {
                element.classList.add('correct');
                score += 10;
                updateScore();
                setTimeout(generateLetterQuestion, 1000);
            } else {
                element.classList.add('wrong');
                setTimeout(() => element.classList.remove('wrong'), 500);
            }
        }

        function generateNumberQuestion() {
            const num = Math.floor(Math.random() * 10) + 1;
            const options = [num];

            while (options.length < 4) {
                const random = Math.floor(Math.random() * 10) + 1;
                if (!options.includes(random)) {
                    options.push(random);
                }
            }

            options.sort(() => Math.random() - 0.5);

            const emojis = ['🍎', '⭐', '🎈', '🌟', '🍪', '🐱', '🌸', '🎵'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];

            const gameArea = document.getElementById('gameArea');
            gameArea.innerHTML = `
                <div class="game-question">Count the ${emoji.repeat(num)}</div>
                <div class="game-options">
                    ${options.map(opt => `
                        <div class="game-option" onclick="checkNumberAnswer(${opt}, ${num}, this)">
                            ${opt}
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function checkNumberAnswer(selected, correct, element) {
            if (selected === correct) {
                element.classList.add('correct');
                score += 10;
                updateScore();
                setTimeout(generateNumberQuestion, 1000);
            } else {
                element.classList.add('wrong');
                setTimeout(() => element.classList.remove('wrong'), 500);
            }
        }

        function updateScore() {
            const stars = '⭐'.repeat(Math.floor(score / 25));
            document.getElementById('scoreDisplay').innerHTML = `
                Score: ${score} ${stars ? '<span class="stars">' + stars + '</span>' : ''}
            `;
        }

        // Initialize
        initABCGrid();
        initNumbersGrid();
        initTracing();
    </script>
</body>
</html>
